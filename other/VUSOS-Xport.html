<!DOCTYPE html>
<html lang="en">
<!-- version near L334. under CONFIG -->
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VUS-OS</title>
<style>
:root{--bg:#000;--el:#202020;--card:#2b2b2b;--hover:#3a3a3a;--bd:#3d3d3d;--fg:#fff;--mute:#a6a6a6;--dim:#767676;--ac:#0078d7;--ac2:#4cc2ff;--danger:#e81123;--tb:40px;--font:'Segoe UI',system-ui,-apple-system,Roboto,sans-serif;--mono:Consolas,'JetBrains Mono',monospace}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;user-select:none}
input,select,button{font-family:var(--font)}
.gl{display:flex;align-items:center;justify-content:center;font-weight:600;flex-shrink:0;border-radius:2px}
.win-logo{display:grid;grid-template-columns:1fr 1fr;gap:2px;width:18px;height:18px}
.win-logo i{background:#fff}

#boot{position:fixed;inset:0;z-index:1000;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:40px;transition:opacity .4s}
#boot.hide{opacity:0;pointer-events:none}
#boot .win-logo{width:72px;height:72px;gap:5px}
.spin{width:34px;height:34px;border-radius:50%;border:3px solid #333;border-top-color:#fff;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#bootTitle{font-size:15px;color:#bbb}
#bootLog{width:min(420px,90vw);height:68px;overflow:hidden;font:12px var(--mono);color:#777;display:flex;flex-direction:column;justify-content:flex-end}

#desktop{position:fixed;inset:0 0 var(--tb) 0;overflow:hidden}
#icons{position:absolute;inset:0;touch-action:none}
#icons .icon{position:absolute;width:calc(var(--cw,80px) - 4px);touch-action:none}
.icon{display:flex;flex-direction:column;align-items:center;gap:5px;padding:6px 2px;border:1px solid transparent;cursor:default;text-align:center}
.icon:hover{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.15)}
.icon.sel{background:color-mix(in srgb,var(--ac) 40%,transparent);border-color:var(--ac)}
.lbl{font-size:12px;line-height:1.2;color:#fff;text-shadow:0 1px 2px #000,0 0 4px rgba(0,0,0,.6);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}

.win{position:absolute;min-width:300px;min-height:200px;background:var(--el);border:1px solid #3a3a3a;box-shadow:0 8px 28px rgba(0,0,0,.55);display:flex;flex-direction:column;overflow:hidden}
.win.focus{border-color:var(--ac);box-shadow:0 12px 40px rgba(0,0,0,.6)}
.win.min{display:none}
.win.max{top:0!important;left:0!important;width:100%!important;height:100%!important;border:0}
.bar{height:32px;flex-shrink:0;display:flex;align-items:center;gap:8px;padding-left:8px;background:#2b2b2b;touch-action:none}
.win.focus .bar{background:#1c1c1c}
.wt{flex:1;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar button{width:46px;height:32px;border:0;background:transparent;color:#fff;font-size:12px;cursor:default}
.bar button:hover{background:rgba(255,255,255,.1)}
.bar button.x:hover{background:var(--danger)}
.body{flex:1;min-height:0;position:relative;background:#000;overflow:hidden}
.body iframe{width:100%;height:100%;border:0;display:block}
.load{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:13px var(--mono);color:var(--dim);background:var(--el)}
.load.err{color:#ff6b6b}
.win:not(.focus) .body:has(iframe)::after{content:"";position:absolute;inset:0;z-index:3}
.bar button svg{pointer-events:none}.bar .i2{display:none}.win.max .bar .i1{display:none}.win.max .bar .i2{display:inline}
.pbar{width:220px;height:6px;background:#444;margin:12px auto 0}.pbar i{display:block;height:100%;width:0;background:var(--ac)}
.lock{position:fixed;inset:0;z-index:990;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(20,20,20,.55);backdrop-filter:blur(8px);color:#fff}
.lock.full{background:rgba(10,10,10,.92);backdrop-filter:blur(40px)}
.lk-time{font-size:72px;font-weight:200}.lk-date{font-size:20px;margin-bottom:24px}.lk-t{font-size:16px}
.lk-dots{display:flex;gap:14px}.lk-dots i{width:14px;height:14px;border:2px solid #fff;border-radius:50%}.lk-dots i.on{background:#fff}
.lk-msg{height:18px;font-size:13px;color:#ff8a8a}
.lk-pad{display:grid;grid-template-columns:repeat(3,64px);gap:8px}.lk-pad button{height:52px;font-size:20px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:2px;cursor:pointer}.lk-pad button:hover{background:rgba(255,255,255,.22)}
.lk-foot{display:flex;gap:20px;font-size:13px;margin-top:6px}.lk-foot a{color:#fff;opacity:.8;text-decoration:underline;cursor:pointer}
.shake{animation:shk .3s}@keyframes shk{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.lk-in{width:240px;height:36px;padding:0 10px;font-size:15px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:2px;outline:0}
.lk-ok{height:32px;padding:0 24px;background:var(--ac);border:0;color:#fff;border-radius:2px;cursor:pointer}
.dlg .dlgb{padding:0;min-width:340px;max-width:440px}
.dlgt{padding:8px 12px;font-size:12px;opacity:.85}
.dlgm{padding:14px 18px 6px}.dlgm p{margin:0 0 10px;font-size:14px;line-height:1.5}
.dlg .dlgf{display:flex;justify-content:flex-end;gap:8px;padding:12px 14px;background:rgba(128,128,128,.14)}
.dlgf button{min-width:84px;padding:6px 14px;border:1px solid rgba(128,128,128,.6);background:rgba(128,128,128,.2);color:inherit;cursor:pointer}.dlgf button:hover{border-color:var(--ac)}.dlgf button:focus{outline:2px solid var(--ac);outline-offset:1px}.dlgf button.danger{background:#c42b1c;border-color:#c42b1c;color:#fff}
.rz{position:absolute;touch-action:none;z-index:6}
.rz.n{top:0;left:10px;right:10px;height:5px;cursor:ns-resize}.rz.s{bottom:0;left:10px;right:10px;height:5px;cursor:ns-resize}
.rz.e{right:0;top:10px;bottom:10px;width:5px;cursor:ew-resize}.rz.w{left:0;top:10px;bottom:10px;width:5px;cursor:ew-resize}
.rz.ne,.rz.nw,.rz.se,.rz.sw{width:12px;height:12px}
.rz.ne{top:0;right:0;cursor:nesw-resize}.rz.nw{top:0;left:0;cursor:nwse-resize}.rz.se{bottom:0;right:0;cursor:nwse-resize}.rz.sw{bottom:0;left:0;cursor:nesw-resize}
.win.max .rz{display:none}
@media (pointer:coarse){.rz.n,.rz.s{height:12px}.rz.e,.rz.w{width:12px}.rz.ne,.rz.nw,.rz.se,.rz.sw{width:22px;height:22px}}

#taskbar{position:fixed;left:0;right:0;bottom:0;height:var(--tb);background:rgba(16,16,16,.93);backdrop-filter:blur(20px);display:flex;align-items:stretch;z-index:500}
#startBtn{width:48px;border:0;background:transparent;display:flex;align-items:center;justify-content:center;cursor:default;flex-shrink:0}
#startBtn:hover,#startBtn.on{background:rgba(255,255,255,.14)}
#searchBtn{width:240px;margin:0 4px;padding:0 12px;display:flex;align-items:center;background:#2f2f2f;border:1px solid #454545;color:#bbb;font-size:13px;cursor:text;flex-shrink:0;align-self:center;height:32px;margin-top:0}
@media(max-width:760px){#searchBtn{display:none}}
#sys{display:flex;flex-shrink:0}
.sys{width:48px;display:flex;align-items:center;justify-content:center;font-size:18px;cursor:default}
.sys:hover{background:rgba(255,255,255,.14)}
#tasks{flex:1;display:flex;overflow-x:auto;scrollbar-width:none;min-width:0}
.task{display:flex;align-items:center;gap:8px;min-width:48px;max-width:170px;padding:0 12px;font-size:12px;border-bottom:2px solid var(--ac2);background:rgba(255,255,255,.06);cursor:default;flex-shrink:0}
.task:hover{background:rgba(255,255,255,.14)}
.task{border-bottom-color:#777}.task.active{background:rgba(255,255,255,.2);border-bottom-color:var(--ac2)}
#tasks[data-labels=full] .task{max-width:none}
#tasks[data-labels=partial] .task{max-width:120px}
#tasks[data-labels=hide] .task span,#tasks[data-labels=hover] .task span{display:none}
.task span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#clock{padding:0 10px;display:flex;flex-direction:column;justify-content:center;align-items:center;font-size:12px;line-height:1.3;flex-shrink:0}
#tray{display:flex;align-items:stretch;flex-shrink:0}
#tray .tr,#bell{min-width:34px;padding:0 4px;display:flex;align-items:center;justify-content:center;cursor:default;position:relative;flex-shrink:0;font-size:11px}
#tray .tr:hover,#bell:hover,#clock:hover{background:rgba(255,255,255,.1)}
[data-theme=light] #tray .tr:hover,[data-theme=light] #bell:hover,[data-theme=light] #clock:hover{background:rgba(0,0,0,.08)}
#bell .bdg{position:absolute;top:5px;right:3px;min-width:14px;height:14px;border-radius:7px;background:var(--ac);color:#fff;font-size:10px;line-height:14px;text-align:center}
#flyout{position:fixed;right:0;bottom:var(--tb);width:360px;max-width:100%;max-height:calc(100% - var(--tb));overflow:auto;background:rgba(31,31,31,.97);backdrop-filter:blur(30px);border:1px solid #3a3a3a;border-bottom:0;display:none;z-index:650;padding:14px;color:#fff}
[data-theme=light] #flyout{background:rgba(246,246,246,.98);border-color:#c8c8c8;color:#111}
.cal-h{font-size:34px;font-weight:300}.cal-d{font-size:14px;opacity:.8;margin:2px 0 10px}
.cal-n{display:flex;align-items:center;justify-content:space-between;margin:8px 0}.cal-n button{background:none;border:0;color:inherit;font-size:13px;width:32px;height:28px;cursor:pointer}.cal-n button:hover{background:rgba(128,128,128,.25)}
.cal-g{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;gap:2px}.cal-g span{padding:8px 0;font-size:13px}.cal-g .w{opacity:.6;font-size:11px}.cal-g .o{opacity:.4}.cal-g .t{background:var(--ac);color:#fff;opacity:1}
#flyout a{cursor:pointer;text-decoration:underline;font-size:13px;opacity:.85}
.ac-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.ac-n{padding:10px;margin-bottom:6px;background:rgba(128,128,128,.18);font-size:13px}.ac-n small{display:block;opacity:.6;margin-top:4px}.ac-l p{opacity:.6;padding:16px 0;text-align:center}
.ac-q{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:12px}.ac-q button{padding:12px 4px;font-size:12px;border:0;background:rgba(128,128,128,.25);color:inherit;cursor:pointer}.ac-q button:hover{background:var(--ac);color:#fff}
#toasts{position:fixed;right:12px;bottom:calc(var(--tb) + 12px);z-index:700;display:flex;flex-direction:column;gap:8px}
.toast{width:320px;max-width:calc(100vw - 24px);padding:12px 14px;background:#2b2b2b;color:#fff;border-left:3px solid var(--ac);box-shadow:0 8px 24px rgba(0,0,0,.5);font-size:13px}.toast div{opacity:.8;margin-top:3px}
[data-theme=light] .toast{background:#fff;color:#111}
#showdesk{width:6px;border-left:1px solid #555;flex-shrink:0}
#showdesk:hover{background:rgba(255,255,255,.2)}

#start{position:fixed;left:0;bottom:var(--tb);width:690px;max-width:100%;height:min(600px,calc(100% - var(--tb)));background:rgba(31,31,31,.97);backdrop-filter:blur(30px);border:1px solid #3a3a3a;border-bottom:0;display:none;z-index:600}
#start.open{display:flex}
.st-l{width:290px;display:flex;flex-direction:column;border-right:1px solid #2e2e2e;min-width:0}
.st-l input{margin:10px;padding:9px 10px;background:#2b2b2b;border:1px solid #444;color:#fff;font-size:13px;outline:none;user-select:text}
.st-l input:focus{border-color:var(--ac)}
#startList{flex:1;overflow-y:auto;padding:0 4px 8px}
.st-h{font-size:12px;font-weight:600;color:var(--ac2);padding:8px 10px 2px}
.st-r{flex:1;padding:14px 12px;overflow-y:auto}
.st-r h3{font-size:14px;font-weight:600;margin-bottom:10px;color:#ddd}
#tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.tile{aspect-ratio:1;display:flex;flex-direction:column;justify-content:space-between;padding:8px;border:2px solid transparent;cursor:default}
.tile:hover{border-color:rgba(255,255,255,.5)}
.tile .ti{font-size:28px;align-self:center;margin-top:10px}
.tile .tn{font-size:12px;line-height:1.2}
@media(max-width:560px){.st-r{display:none}.st-l{width:100%}}
.item{display:flex;align-items:center;gap:12px;padding:6px 10px;cursor:default}
.item:hover{background:rgba(255,255,255,.1)}
.item b{display:block;font-size:13px;font-weight:400}
.item small{display:block;font-size:11px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item.row:hover{background:none}

.pad{height:100%;overflow-y:auto;padding:20px 24px;background:var(--el);display:flex;flex-direction:column;gap:12px}
.pad h2{font-size:20px;font-weight:600}
.pad label{display:flex;justify-content:space-between;align-items:center;gap:16px;font-size:14px;padding:10px 0;border-bottom:1px solid var(--bd)}
.pad input,.pad select{background:#333;border:1px solid #666;padding:6px 10px;color:#fff;font-size:13px;outline:none;border-radius:0;user-select:text}
.pad input:focus,.pad select:focus{border-color:var(--ac)}
.pad label input[type=text]{width:200px}
.pad input[type=checkbox]{width:18px;height:18px;accent-color:var(--ac);padding:0}
.tabs{display:flex;gap:6px}
.tabs button,.card button,.item button{padding:6px 14px;border:1px solid #666;background:#333;color:#fff;font-size:12px;cursor:default;border-radius:0}
.tabs button:hover,.card button:hover,.item button:hover{background:#444}
.tabs button.on,.card button.on,.item button.on{background:var(--ac);border-color:var(--ac)}
.item button{margin-left:auto;flex-shrink:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;align-content:start}
.card{background:var(--card);border:1px solid var(--bd);padding:14px;display:flex;flex-direction:column;gap:10px}
.card div{display:flex;align-items:center;gap:10px;font-size:14px}
.card p{font-size:12px;color:var(--mute);line-height:1.4}
.card button{align-self:flex-start}
.st{display:flex;height:100%;background:var(--el)}
.stn{width:170px;flex-shrink:0;border-right:1px solid var(--bd);padding:8px 0;overflow-y:auto}
.stn div{padding:10px 14px;cursor:default;font-size:13px;border-left:3px solid transparent}
.stn div:hover{background:rgba(255,255,255,.08)}.stn div.on{border-left-color:var(--ac);background:rgba(255,255,255,.06)}
.stc{flex:1;min-width:0;overflow-y:auto;padding:20px 26px;display:flex;flex-direction:column;gap:10px}
.stc h2{font-size:22px;font-weight:600}.stc h3{font-size:14px;font-weight:600;margin-top:14px}
.stc label{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:8px 0;font-size:13px;border-bottom:1px solid var(--bd)}
.stc input,.stc select{background:#333;border:1px solid #666;padding:6px 10px;color:#fff;font-size:13px;outline:none;border-radius:0;user-select:text}
.stc input[type=checkbox]{width:18px;height:18px;accent-color:var(--ac)}.stc input[type=color]{padding:0;width:44px;height:28px}
.stc button{padding:6px 14px;border:1px solid #666;background:#333;color:#fff;font-size:12px;cursor:default;align-self:flex-start}
.stc button:hover{background:#444}.stc p{font-size:12px;color:var(--mute)}
.sth{display:flex;flex-wrap:wrap;gap:10px}
.stt{display:flex;flex-direction:column;gap:6px;width:150px;height:96px;padding:12px;background:var(--card);border:1px solid transparent;cursor:default;font-size:13px}
.stt:hover{border-color:var(--ac)}.stt span{font-size:26px}
.sbar{height:10px;background:#444}.sbar i{display:block;height:100%;background:var(--ac)}
.sws{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.sw{width:28px;height:28px;border:2px solid transparent;cursor:default}.sw.on{border-color:#fff}
.fxw{height:100%;display:flex;flex-direction:column;background:var(--el)}
.fxt{padding:6px;background:#2b2b2b;align-items:center}.fxp{font-size:12px;color:var(--mute);margin-left:8px}
.fx{flex:1;overflow:auto;padding:8px;display:grid;grid-template-columns:repeat(auto-fill,var(--cw,80px));grid-auto-rows:var(--rh,92px);gap:2px;align-content:start;position:relative}
.fx{position:relative}
.marq{position:absolute;border:1px solid var(--ac);background:color-mix(in srgb,var(--ac) 30%,transparent);pointer-events:none;z-index:5}
.icon.dragging{pointer-events:none;opacity:.65;z-index:5}
.icon.lnk .gl{position:relative}.icon.lnk .gl::after{content:"↗";position:absolute;left:0;bottom:0;width:14px;height:14px;background:#fff;color:#0078d7;border:1px solid #0078d7;border-radius:2px;font-size:10px;line-height:13px;text-align:center}
.icon.row.lnk .gl::after{width:9px;height:9px;font-size:7px;line-height:8px}
.icon.cut{opacity:.5}
.rn{width:100%;font:inherit;font-size:12px;background:#fff;color:#000;border:1px solid var(--ac);padding:1px 2px;text-align:center;outline:none;user-select:text}
.fxb{flex:1;display:flex;min-height:0}
.fxs{width:150px;flex-shrink:0;border-right:1px solid var(--bd);padding:6px 0}
.fxs div{display:flex;gap:8px;align-items:center;padding:8px 14px;font-size:13px;cursor:default;border-left:3px solid transparent}
.fxs div:hover{background:rgba(255,255,255,.08)}.fxs div.on{background:rgba(255,255,255,.1);border-left-color:var(--ac)}
.fxs b{margin-left:auto;font-weight:400;font-size:11px;color:var(--mute)}
.fxn{display:flex;gap:6px;padding:6px 6px 0;align-items:center;background:rgba(128,128,128,.14)}
.fxn .nb{width:30px;height:28px;border:1px solid var(--bd);background:rgba(128,128,128,.18);color:inherit;font-size:14px;cursor:default;border-radius:0}.fxn .nb:hover{background:rgba(128,128,128,.32)}
.fxad{flex:1;min-width:0;display:flex;align-items:center;gap:1px;height:28px;padding:0 4px;border:1px solid var(--bd);background:rgba(128,128,128,.1);font-size:12px;overflow:hidden;white-space:nowrap}
.fxad .seg{padding:3px 6px;cursor:default}.fxad .seg:hover{background:rgba(128,128,128,.28)}.fxad i{opacity:.5;font-style:normal;font-size:11px}
.fxq{width:170px;height:28px;padding:0 8px;border:1px solid var(--bd);background:rgba(128,128,128,.1);color:inherit;font-size:12px;outline:0}.fxq:focus{border-color:var(--ac)}
.fxw .fxt{background:rgba(128,128,128,.14);padding:6px}
.fxs{width:200px;overflow:auto}.fxs .tn{padding:5px 8px;gap:6px;font-size:13px}.fxs .tg{width:14px;text-align:center;font-size:9px;opacity:.7;flex-shrink:0}.fxs .tl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}.fxs .tsep{height:1px;padding:0;margin:6px 8px;background:var(--bd);border:0}
[data-theme=light] .fxn,[data-theme=light] .fxw .fxt{background:#f0f0f0}
.fxe{grid-column:1/-1;color:var(--dim);font-size:13px;padding:20px}
.fxa{margin-left:auto;display:flex;gap:6px}
.fxtabs{display:flex;gap:2px;padding:4px 6px 0;background:rgba(128,128,128,.14);overflow-x:auto;scrollbar-width:none}
.fxtabs div{display:flex;gap:8px;align-items:center;padding:5px 10px;max-width:170px;font-size:12px;border:1px solid var(--bd);border-bottom:0;white-space:nowrap;cursor:default;flex-shrink:0}
.fxtabs div:hover{background:rgba(128,128,128,.22)}.fxtabs div.on{background:var(--el)}.fxtabs b{font-weight:400;opacity:.6}.fxtabs b:hover{opacity:1}
.fxv{display:none;width:240px;flex-shrink:0;border-left:1px solid var(--bd);padding:12px;overflow:auto;font-size:12px;background:var(--el)}.fxv p{margin:4px 0}
#pins{display:flex;flex-shrink:0}
.pin{touch-action:none;width:48px;display:flex;align-items:center;justify-content:center;cursor:default;border-bottom:2px solid transparent;flex-shrink:0}
.pin:hover{background:rgba(255,255,255,.14)}.pin.run{border-bottom-color:var(--ac2)}.pin.active{background:rgba(255,255,255,.2)}
.dt{padding:18px 22px;overflow:auto;height:100%;background:var(--el)}
.dt h2{display:flex;gap:12px;align-items:center;font-size:16px;font-weight:600;margin-bottom:14px;word-break:break-all}
.dt table{width:100%;border-collapse:collapse;font-size:13px}
.dt th{text-align:left;color:var(--mute);font-weight:400;padding:6px 12px 6px 0;width:130px;vertical-align:top}

// ===================== CONFIG =====================
const APPS_JSON = "https://raw.githubusercontent.com/Cra-Z-Gaming/VUS/refs/heads/main/apps.json";

async function mediaInfo(f, k, blob) { // extra rows that depend on what's inside the file
  if (!blob) return [["Contents", "File data not found"]];
  if (k === "binary") return [["Contents", "Program file (can't be opened here)"]];
  const url = URL.createObjectURL(new Blob([blob], { type: mimeOf(f.name) })), done = r => { URL.revokeObjectURL(url); return r; };
  if (k === "image") return new Promise(res => { const i = new Image(); i.onload = () => res(done([["Dimensions", `${i.naturalWidth} × ${i.naturalHeight} px`], ["Aspect ratio", ratio(i.naturalWidth, i.naturalHeight)], ["Megapixels", (i.naturalWidth * i.naturalHeight / 1e6).toFixed(2) + " MP"]])); i.onerror = () => res(done([["Image", "Couldn't read this image"]])); i.src = url; });
  if (k === "audio" || k === "video") return new Promise(res => {
    const m = document.createElement(k), bad = () => { clearTimeout(t); res(done([["Media", "Couldn't read this file (unsupported format?)"]])); }, t = setTimeout(bad, 5000);
    m.preload = "metadata";
    m.onloadedmetadata = () => {
      clearTimeout(t); const ok = isFinite(m.duration), r = [["Length", ok ? dur(m.duration) : "Unknown"]];
      if (k === "video" && m.videoWidth) r.push(["Frame size", `${m.videoWidth} × ${m.videoHeight} px`], ["Aspect ratio", ratio(m.videoWidth, m.videoHeight)]);
      if (ok && m.duration > 0) r.push(["Average bitrate", Math.round((f.size || 0) * 8 / m.duration / 1000) + " kbps"]);
      res(done(r));
    };
    m.onerror = bad; m.src = url;
  });
  if ((f.size || 0) > 20e6) return done([]);
  const t = await blob.text();
  if (k === "pdf") { const n = (t.match(/\/Type\s*\/Page[^s]/g) || []).length; return done(n ? [["Pages (approx.)", n]] : []); }
  const rows = [["Lines", (t ? t.split(/\r\n|\r|\n/).length : 0).toLocaleString()], ["Words", (t.trim() ? t.trim().split(/\s+/).length : 0).toLocaleString()], ["Characters", t.length.toLocaleString()]];
  if (k === "html") { const m = t.match(/<title[^>]*>([\s\S]*?)<\/title>/i); if (m) rows.unshift(["Page title", esc(m[1].trim())]); }
  if (extOf(f.name) === "json") { try { const j = JSON.parse(t); rows.unshift(["JSON", Array.isArray(j) ? `Valid, array of ${j.length}` : j && typeof j === "object" ? `Valid, object with ${Object.keys(j).length} keys` : "Valid"]); } catch { rows.unshift(["JSON", "Not valid JSON"]); } }
  return done(rows);
}

  const base = [["Name", esc(f.name)], ["Type", KIND_NAME[k] + (ext ? ` (.${esc(ext)})` : "")], ["MIME type", esc(mimeOf(f.name))], ["Size", sizeStr(f.size)], ["Location", esc(pathOf(f.parent || null))], ["Status", f.saved === false ? "Temporary (not saved yet)" : "Saved"], ["Modified", when(f.mod)]];

  q(".vo").onchange = e => { d[e.target.dataset.o] = e.target.checked; touch(); };
  async function save() {
    if (!check()) return false;
    const m = meta(); if (!m) return false;
    const ok = await putFile(id, m.name, new Blob([JSON.stringify(d)], { type: "application/json" }), undefined, true);
    if (ok) { dirty = false; title(); } return ok;
  }
  root.onclick = e => {
    const a = e.target.closest("[data-a]")?.dataset.a; if (!a) return;
    if (a === "add") { d.lines.push({ name: "", cmd: "", delay: 0 }); draw(); touch(); list.scrollTop = list.scrollHeight; list.querySelector(".vr:last-child .vn").focus(); }
    else if (a === "del") { d.lines.splice(+e.target.closest(".vr").dataset.i, 1); if (!d.lines.length) d.lines.push({ name: "", cmd: "", delay: 0 }); draw(); touch(); }
    else if (a === "save") save();
    else if (a === "run" && check()) runVsh(id, d);
  };
  root.addEventListener("keydown", e => { if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s" && keysOn("keysEdit")) { e.preventDefault(); save(); } });
  os.guard(() => { // closing with unsaved changes asks first, unless "Don't ask" is ticked
    if (!dirty || d.skip) return true;
    if (!asking) {
      asking = true;
      winDialog(`Do you want to save changes to ${(meta() || { name: "this shortcut" }).name}?`, [["Save", "save"], ["Don't Save", "discard"], ["Cancel", false]]).then(async c => {
        asking = false;
        if (c === "save") { if (await save()) os.close(true); } else if (c === "discard") os.close(true);
      });
    }
    return false;
  });
  draw(); title();
}

// ===================== RESTART, SYSTEM UPDATE, MIGRATION =====================
const unsavedWins = () => [...wins.values()].filter(w => w.el.querySelector(".wt").textContent.startsWith("*")); // apps mark unsaved work with a leading *
const unsavedMsg = (l, verb) => `These have unsaved changes:\n${l.map(w => "• " + w.el.querySelector(".wt").textContent.replace(/^\*/, "")).join("\n")}\n\n${verb} anyway? Unsaved changes will be lost.`;

async function softRestart() { // closes everything and boots again without reloading, so about:blank survives
  const dirty = unsavedWins();
  if (dirty.length && await winDialog(unsavedMsg(dirty, "Restart"), [["Restart anyway", "y", "danger"], ["Cancel", false]]) !== "y") return;
  [...wins.keys()].forEach(id => closeWin(id, true));
  toggleStart(false); hideFly(); $("#ctx").style.display = "none"; $("#toasts").innerHTML = "";
  clip = null; deskHidden = null; launchQ.length = 0; bypassLimit = false; notes.length = 0; renderBell(); osLatest = null; vshRunning.clear();
  const b = document.createElement("div"); b.id = "boot";
  b.innerHTML = `<div class="win-logo"><i></i><i></i><i></i><i></i></div><div class="spin"></div><div id="bootTitle">${esc(getSettings().site)}</div>`;
  document.body.appendChild(b);
  await new Promise(r => setTimeout(r, 1500));
  applyTheme(); renderPins(); autoUpdate(); checkOsUpdate(); lockNow(); runStartup();
  b.classList.add("hide"); setTimeout(() => b.remove(), 550);
}

// Remembers which windows are open so an update can bring them back. Apps the update removed simply don't come back.
const SYS_APPS = () => [EXPLORER, SETTINGS, STORE, UPDATES, TASKMGR, BIN];
const snapshotWins = () => [...wins.values()].map(w => {
  const a = w.app, s = w.el.style, o = { z: +s.zIndex, l: s.left, t: s.top, w: s.width, h: s.height, max: w.el.classList.contains("max"), min: w.el.classList.contains("min"), top: !!w.onTop };
  if (catalog.includes(a)) return { ...o, key: key(a) };
  if (SYS_APPS().includes(a)) return { ...o, sys: a.name };
  if (a.fid) return { ...o, fid: a.fid };
  if (a.did) return { ...o, did: a.did };
  return null;
}).filter(Boolean);
function restoreWins() {
  let l = null; try { l = JSON.parse(sessionStorage.getItem("vos_restore") || "null"); } catch {}
  sessionStorage.removeItem("vos_restore"); if (!l) return;
  const sys = Object.fromEntries(SYS_APPS().map(a => [a.name, a]));
  l.sort((x, y) => x.z - y.z).forEach(o => {
    const f = o.fid && fmeta().find(x => x.id === o.fid);
    const a = o.sys ? sys[o.sys] : o.key ? catalog.find(x => key(x) === o.key) : f ? fileApp(f) : o.did && folders().some(x => x.id === o.did) ? folderApp(o.did) : null;
    if (!a) return;
    openApp(a); const w = [...wins.values()].pop(); if (!w) return;
    Object.assign(w.el.style, { left: o.l, top: o.t, width: o.w, height: o.h }); w.el.classList.toggle("max", o.max); if (o.top) toggleOnTop(w.id);
    if (o.min) { w.el.classList.add("min"); w.task.classList.remove("active"); }
  });
  renderPins();
}
async function updateOS(force) { // returns a message if it did NOT update
  let html;
  try { const r = await fetch(OS_REPO + "index.html?t=" + Date.now(), { cache: "no-store" }); if (!r.ok) throw 0; html = await r.text(); }
  catch { return "Couldn't download the update."; }
  if (!/<title>/i.test(html) || !/APPS_JSON/.test(html)) return "That doesn't look like VUS-OS, so it was not installed.";
  const latest = (html.match(/const OS_VERSION = "([^"]+)"/) || [])[1];
  if (!force && latest && latest === OS_VERSION) return 'Already up to date. Use "sys-upd force" to reinstall anyway.';
  const dirty = unsavedWins();
  if (dirty.length && await winDialog(unsavedMsg(dirty, "Update"), [["Update anyway", "y", "danger"], ["Cancel", false]]) !== "y") return "Update cancelled.";
  sessionStorage.setItem("vos_restore", JSON.stringify(snapshotWins())); sessionStorage.setItem("vos_ok", "1"); // vos_ok: don't lock again
  // The new version runs in a fresh full-screen frame (a fresh page, so nothing clashes with this one), and the old frame is dropped on later updates.
  const nested = window.frameElement && window.frameElement.dataset.vosShell, host = nested ? window.parent : window;
  const f = host.document.createElement("iframe"); f.dataset.vosShell = "1";
  f.style.cssText = "position:fixed;inset:0;width:100%;height:100%;border:0;z-index:2147483000;background:#000";
  host.document.body.appendChild(f);
  const d = f.contentDocument; d.open(); d.write(html); d.close();
  if (nested) window.frameElement.remove();
}

// Terminal moved from apps/OS to apps/Terminal: carry installs, Start pins, taskbar pins and icon spots over to the new key.
function migrateKeys() {
  const o = "Terminal|" + OS_REPO + "apps/OS/terminal.js", n = "Terminal|" + OS_REPO + "apps/Terminal/terminal.js";
  ["installed", "startPins", "pinned"].forEach(k => { const l = LS(k, null); if (Array.isArray(l) && l.includes(o)) save(k, l.map(x => x === o ? n : x)); });
  const p = LS("pos", {}); if (p["app:" + o]) { p["app:" + n] = p["app:" + o]; delete p["app:" + o]; save("pos", p); }
  if (!LS("migSnap", false)) { const s = LS("settings", null); if (s && s.snap === false) save("settings", { ...s, snap: true }); save("migSnap", true); } // snap-to-edges is now on by default, switched on once for everyone
}

// ===================== UPDATE NOTICE, CLOSE WARNING, IDLE LOCK, STARTUP SHORTCUTS =====================
async function checkOsUpdate() { // toast when the OS on GitHub is newer than this build
  const l = await latestOs();
  if (l && l !== OS_VERSION) notify("Update available", `Version-${l} is out (you have Version-${OS_VERSION}). Run sys-upd in Terminal.`);
}
addEventListener("beforeunload", e => { if (unsavedWins().length) { e.preventDefault(); e.returnValue = ""; } }); // closing the tab with unsaved work asks first

let lastAct = Date.now(); // any click, key, scroll or touch counts as activity
["pointerdown", "pointermove", "keydown", "wheel", "touchstart"].forEach(ev => addEventListener(ev, () => { lastAct = Date.now(); }, { capture: true, passive: true }));
setInterval(() => {
  const m = getSettings().idleLock;
  if (m && !GUEST && hasPw() && !$(".lock.full,.sleep") && Date.now() - lastAct > m * 60000) lockNow();
}, 10000);

async function runStartup() { // shortcuts with "Run when VUS-OS starts" ticked
  for (const f of fmeta().filter(x => /\.vsh$/i.test(x.name))) {
    try { const b = await dbGet(f.id, "files"); if (b && vshParse(await b.text()).startup) await runVsh(f.id); } catch {}
  }
}

// ===================== TASKBAR SETTINGS + SETTINGS SHORTCUT =====================
function applyTaskbar() {
  const s = getSettings();
  $("#searchBtn").style.display = s.taskSearch ? "" : "none";
  $("#tasks").dataset.labels = s.taskLabels; document.documentElement.dataset.tb = s.taskPos;
  document.querySelectorAll("#tasks .task").forEach(t => { t.title = tipOn() ? t.dataset.name || "" : ""; });
}
function tipOn() { const s = getSettings(); return s.taskLabels === "hover" || s.taskPos === "left" || s.taskPos === "right"; } // names are hidden, so show a tooltip
function toggleOnTop(id) { const w = wins.get(id); if (!w) return; w.onTop = !w.onTop; w.el.classList.toggle("ontop", w.onTop); focus(id); }
function openSettings(page) { // opens Settings on a page, or jumps there if Settings is already open
  const w = [...wins.values()].find(x => x.app === SETTINGS);
  if (w && settingsNav) { settingsNav(page); w.el.classList.remove("min"); focus(w.id); return; }
  settingsStart = page; openApp(SETTINGS);
}

// ===================== BOOT =====================
applyTheme();
marquee($("#icons"));
const minBoot = new Promise(r => setTimeout(r, 2000)); // boot screen shows at least 2s, at most 4s
async function bootWork() { // first run saves the starter apps now; later runs only check index.html when auto update is on
  const ok = await catP;
  if (ok && !LS("seeded", false)) { for (const a of SEED.map(nm => catalog.find(x => x.name === nm)).filter(a => a && a.url && (isNative(a) || /raw\.githubusercontent\.com/.test(a.url)))) { blog("Fetching " + a.url.split("/").pop()); blog((await updateApp(a)) ? "saved for offline" : "couldn't reach it"); } save("lastAppCheck", Date.now()); }
  else if (getSettings().autoUpdate && navigator.onLine) { blog("Checking index.html"); await latestOs(); blog("index.html: checked"); }
  return ok;
}
const catP = loadCatalog();
Promise.all([Promise.race([bootWork().catch(() => false), new Promise(r => setTimeout(() => r(false), 4000))]), minBoot]).then(([ok0]) => {
  const ok = ok0 || catOk;
  if (!catDone) { const d = LS("catalog", null); if (d) addCatalog(d); catP.then(() => { renderIcons(); renderPins(); }); } // the 4s cap hit while the catalog was still loading
  migrateKeys();
  { const seen = LS("seenVer", null); // a notice after the OS changes version (people who had it installed before this feature get one too)
    if ((seen ? seen !== OS_VERSION : LS("seeded", false))) setTimeout(() => notify("VUS-OS updated", `Version-${OS_VERSION}. Click here to see what's new.`, () => openApp(WHATSNEW)), 1500);
    save("seenVer", OS_VERSION); }
  if (!LS("seeded", false)) { // first run: add the starter apps (even offline); only counts as done once the catalog really loaded
    save("installed", [...new Set([...installed(), ...SEED.map(nm => catalog.find(a => a.name === nm)).filter(Boolean).map(key)])]);
    if (ok) save("seeded", true);
  }
  renderIcons(); renderPins();
  const resumed = !!sessionStorage.getItem("vos_restore"); restoreWins(); autoUpdate(false, resumed); remindUpdates(); checkOsUpdate(); if (!resumed) runStartup(); // background; skipped when auto update is off
  if (sessionStorage.getItem("vos_ok")) sessionStorage.removeItem("vos_ok"); else lockNow();
  $("#boot").classList.add("hide");
  setTimeout(() => $("#boot").remove(), 550);
});
</script>
