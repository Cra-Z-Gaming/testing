<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VUSH Testing / Pre-Release</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #121214;
            color: #e1e1e6;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 40px 20px;
            box-sizing: border-box;
        }
        .container {
            background-color: #1d1d22;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            max-width: 980px;
            width: 100%;
            border: 1px solid #29292e;
        }
        .columns {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
        }
        @media (max-width: 700px) {
            .columns {
                grid-template-columns: 1fr;
            }
        }
        h1 {
            font-size: 1.8rem;
            margin: 0 0 0.5rem;
            color: #ffffff;
            text-align: center;
        }
        .notice-box {
            background-color: #29292e;
            border-left: 4px solid #f5a623;
            padding: 1rem;
            border-radius: 0 6px 6px 0;
            text-align: left;
            margin: 1.5rem 0;
            font-size: 0.95rem;
            line-height: 1.5;
        }
        h2 {
            font-size: 1.1rem;
            color: #ffffff;
            margin: 2rem 0 0.75rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid #29292e;
        }
        .list {
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
        }
        .item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            background-color: #29292e;
            border-radius: 6px;
            padding: 0.7rem 1rem;
            text-align: left;
        }
        .item-text {
            min-width: 0;
        }
        .item-name {
            font-weight: 600;
            color: #ffffff;
            font-size: 0.95rem;
        }
        .item-desc {
            color: #8d8d99;
            font-size: 0.82rem;
            margin-top: 0.15rem;
        }
        .btn {
            flex-shrink: 0;
            display: inline-block;
            background-color: #9042f5;
            color: #ffffff;
            text-decoration: none;
            border: none;
            cursor: pointer;
            font-family: inherit;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.85rem;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }
        .btn:hover {
            background-color: #a25eff;
            transform: translateY(-1px);
        }
        .btn:active {
            transform: translateY(1px);
        }
        .info-text {
            color: #8d8d99;
            font-size: 0.9rem;
            line-height: 1.5;
            margin-top: 2rem;
            border-top: 1px solid #29292e;
            padding-top: 1.5rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>VUSH Testing / Pre-release</h1>

        <div class="notice-box">
            Some things posted here might not make it to VUS. 
        </div>

        <div class="columns">
            <div>
                <h2>Links</h2>
                <div class="list" id="linksList"></div>
            </div>
            <div>
                <h2>Games</h2>
                <div class="list" id="gamesList"></div>
            </div>
        </div>

        <p class="info-text">
            This staging page is used for testing new features before they are officially published to VUSH.
        </p>
    </div>

    <script>
        // ===================== EDIT HERE =====================
        // Give each entry a name, a short description, and a url.
        // Leave url as "" to keep that slot showing as empty.

        const LINKS = [
            { name: "Movie 1", description: "these are hosted from my home so it wont be the best", url: "https://notvlad.duckdns.org" },
            { name: "", description: "", url: "" },
            { name: "", description: "", url: "" },
            { name: "", description: "", url: "" },
            { name: "", description: "", url: "" },
            { name: "", description: "", url: "" },
            { name: "", description: "", url: "" },
            { name: "", description: "", url: "" },
            { name: "", description: "", url: "" },
            { name: "", description: "", url: "" },
            { name: "", description: "", url: "" },
            { name: "", description: "", url: "" }
        ];

        const GAMES = [
            { name: "", description: "", url: "" },
            { name: "", description: "", url: "" },
            { name: "", description: "", url: "" },
            { name: "", description: "", url: "" },
            { name: "", description: "", url: "" },
            { name: "", description: "", url: "" },
            { name: "", description: "", url: "" },
            { name: "", description: "", url: "" },
            { name: "", description: "", url: "" },
            { name: "", description: "", url: "" },
            { name: "", description: "", url: "" }
        ];

        // =================== END EDIT ZONE ===================

        function escapeHtml(str) {
            return String(str).replace(/[&<>"']/g, c => ({
                "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
            }[c]));
        }

        function renderLinks() {
            const list = document.getElementById("linksList");
            list.innerHTML = "";
            LINKS.filter(item => item.url.trim() !== "").forEach(item => {
                const row = document.createElement("div");
                row.className = "item";
                row.innerHTML = `
                    <div class="item-text">
                        <div class="item-name">${escapeHtml(item.name)}</div>
                        <div class="item-desc">${escapeHtml(item.description)}</div>
                    </div>
                    <a class="btn" href="${escapeHtml(item.url)}" target="_blank" rel="noopener noreferrer">
                        Open
                    </a>
                `;
                list.appendChild(row);
            });
        }

        function renderGames() {
            const list = document.getElementById("gamesList");
            list.innerHTML = "";
            GAMES.filter(item => item.url.trim() !== "").forEach(item => {
                const row = document.createElement("div");
                row.className = "item";
                row.innerHTML = `
                    <div class="item-text">
                        <div class="item-name">${escapeHtml(item.name)}</div>
                        <div class="item-desc">${escapeHtml(item.description)}</div>
                    </div>
                    <a class="btn" href="${escapeHtml(item.url)}" target="_blank" rel="noopener noreferrer">
                        Play
                    </a>
                `;
                list.appendChild(row);
            });
        }

        renderLinks();
        renderGames();
    </script>
</body>
</html>
